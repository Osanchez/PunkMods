name: Build & Release Mods

# Every push/merge to main builds all mods and publishes one zip per mod as a GitHub Release.
# The proprietary reference DLLs are NOT in git; they're pulled from the 'refs' release asset in the
# private Osanchez/PunkMods-refs repo, using a fine-grained PAT stored as the REFS_TOKEN secret.
# (This repo can therefore be public without exposing those DLLs.)
on:
  push:
    branches: [main]
    paths-ignore:           # doc-only changes don't warrant a build + release
      - '**.md'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:        # lets you also trigger a build manually from the Actions tab

permissions:
  contents: write           # required to download the 'refs' asset and to create Releases

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # The pinning step below commits back to main, which needs the credentials kept.
        with:
          persist-credentials: true

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Download reference DLLs (private PunkMods-refs release asset)
        env:
          GH_TOKEN: ${{ secrets.REFS_TOKEN }}
        shell: pwsh
        run: |
          if (-not $env:GH_TOKEN) { throw "REFS_TOKEN secret is not set. Create a fine-grained PAT with read access to Osanchez/PunkMods-refs and add it as the REFS_TOKEN secret." }
          New-Item -ItemType Directory -Force -Path gamedir | Out-Null
          gh release download refs --repo Osanchez/PunkMods-refs --pattern punk-refs.zip --dir . --clobber
          Expand-Archive -Path punk-refs.zip -DestinationPath gamedir -Force

      - name: Build & package (one zip per mod)
        shell: pwsh
        run: ./build-package.ps1 -GameDir "$PWD/gamedir" -Ci -PerMod

      - name: Compute version tag
        id: ver
        shell: pwsh
        run: |
          $tag = "v{0}.{1}" -f (Get-Date -Format 'yyyy.MM.dd'), '${{ github.run_number }}'
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      # Read the game version/build id captured by tools/get-game-version.ps1 (committed as
      # game-version.json, since the runner has no real game install) into a one-line release blurb.
      - name: Compose game-version blurb
        id: blurb
        shell: pwsh
        run: |
          $blurb = ''
          if (Test-Path 'game-version.json') {
            $v = Get-Content 'game-version.json' -Raw | ConvertFrom-Json
            $name = if ($v.gameName) { $v.gameName } else { 'PUNK Playtest' }
            $ver  = if ($v.version)      { "game version $($v.version)" } else { $null }
            $bld  = if ($v.steamBuildId) { "Steam build $($v.steamBuildId)" } else { $null }
            if     ($ver -and $bld) { $blurb = "Built for **$name** $ver ($bld)." }
            elseif ($ver)           { $blurb = "Built for **$name** $ver." }
            elseif ($bld)           { $blurb = "Built for **$name** $bld." }
          }
          "blurb=$blurb" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: PUNK Mods ${{ steps.ver.outputs.tag }}
          files: dist/*.zip
          generate_release_notes: true
          append_body: true       # keep the auto-generated notes; add our blurb after them
          body: ${{ steps.blurb.outputs.blurb }}

      # Checksums have to be a POST-BUILD step, because the thing being hashed is the artifact
      # this run just produced. Its whole job is to pin the identity of a published file, so that
      # a zip swapped at the download URL afterwards is refused instead of installed.
      #
      # The download url is pinned along with it. "Latest release" plus a hash is a contradiction —
      # the hash names one build while the pointer follows another — and the client BLOCKS an
      # install on a mismatch. Until this step lands, the manifests still name the PREVIOUS
      # release and its hash, which GitHub keeps forever, so the catalog is never inconsistent;
      # it only lags by the length of this job.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Pin downloads and checksums to this release
        shell: pwsh
        run: |
          python tools/pin-downloads.py --dist dist --tag '${{ steps.ver.outputs.tag }}'
          if ($LASTEXITCODE -ne 0) { throw "pin-downloads failed." }

          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add */mod.json
          if (git diff --cached --quiet) {
            Write-Host 'Manifests already pinned to this release; nothing to commit.'
            exit 0
          }
          # [skip ci] is essential: this pushes to main, and main is what triggers this workflow.
          git commit -m 'ci: pin downloads to ${{ steps.ver.outputs.tag }} [skip ci]'
          git push origin HEAD:main
